# DigitalOcean App Platform — static site spec for punkfab.com
#
# Deploy / update:
#   doctl apps create --spec .do/app.yaml           # first time
#   doctl apps update <APP_ID> --spec .do/app.yaml  # subsequent
#
# The custom domain (punkfab.com) is added after the first deploy, once DNS is
# pointed at the app — see README.md.
name: punkfab
region: nyc
static_sites:
  - name: web
    github:
      repo: dnewcome/punkfab
      branch: main
      deploy_on_push: true
    source_dir: /
    index_document: index.html
    catchall_document: 404.html
domains:
  # apex punkfab.com — DNS already points at the DO edge (A @ -> 162.159.140.98).
  # Registering it here lets the edge route the Host to this app + issue TLS.
  # Add a `www` ALIAS here only once a `www` CNAME -> punkfab-fl4hw.ondigitalocean.app exists.
  - domain: punkfab.com
    type: PRIMARY
